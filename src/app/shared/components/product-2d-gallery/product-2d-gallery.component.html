<div class="flex flex-col gap-3 w-full">
  <!-- Main Display Frame with Zoom Magnifier -->
  <div
    class="relative w-full overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm flex items-center justify-center cursor-crosshair group select-none"
    [ngClass]="heightClass"
    (mousemove)="onMouseMove($event)"
    (mouseleave)="onMouseLeave()"
  >
    <!-- Normal Image -->
    <img
      [src]="activeImage()"
      [alt]="product.name"
      class="max-h-full max-w-full object-contain p-4 transition-opacity duration-300"
      [ngClass]="{'opacity-0': isZooming()}"
    />

    <!-- Magnifier Zoom View (revealed on hover) -->
    @if (isZooming()) {
      <div
        class="absolute inset-0 bg-no-repeat pointer-events-none transition-all duration-75"
        [style.backgroundImage]="'url(' + activeImage() + ')'"
        [style.backgroundPosition]="zoomPosition().x + '% ' + zoomPosition().y + '%'"
        [style.backgroundSize]="'220%'"
      ></div>
    }

    <!-- Badges -->
    <div class="absolute top-3 left-3 flex items-center gap-2 z-10 pointer-events-none">
      <span class="px-3 py-1 rounded-full bg-slate-900/80 backdrop-blur-md text-white text-xs font-medium shadow-md border border-white/10">
        Catálogo 2D Tradicional
      </span>
      <span class="px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700 text-xs font-medium border border-indigo-200">
        Foto {{ activeIndex() + 1 }} de {{ product.images2D.gallery.length }}
      </span>
    </div>

    <!-- Hover Hint -->
    <div class="absolute bottom-3 right-3 z-10 pointer-events-none opacity-80 group-hover:opacity-100 transition-opacity">
      <span class="px-3 py-1 rounded-full bg-white/90 backdrop-blur-md text-slate-600 text-xs shadow-sm border border-slate-200 flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7" />
        </svg>
        Pasa el cursor para zoom
      </span>
    </div>
  </div>

  <!-- Thumbnails Row -->
  <div class="flex items-center gap-2.5 overflow-x-auto pb-1">
    @for (img of product.images2D.gallery; track img; let idx = $index) {
      <button
        type="button"
        (click)="selectImage(img, idx)"
        class="relative w-20 h-20 rounded-xl overflow-hidden border-2 bg-white flex items-center justify-center p-1 transition-all duration-150 flex-shrink-0 focus:outline-none"
        [ngClass]="activeIndex() === idx ? 'border-indigo-600 ring-2 ring-indigo-200 scale-105 shadow-md' : 'border-slate-200 hover:border-slate-300 opacity-70 hover:opacity-100'"
      >
        <img [src]="img" [alt]="'Miniatura ' + (idx + 1)" class="max-h-full max-w-full object-contain" />
        <span class="absolute bottom-1 right-1 bg-slate-900/70 text-white text-[9px] px-1 rounded font-mono">
          {{ idx + 1 }}
        </span>
      </button>
    }
  </div>
</div>
